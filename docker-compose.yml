services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-typesend}
      POSTGRES_USER:     ${POSTGRES_USER:-typesend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - typesend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-typesend} -d ${POSTGRES_DB:-typesend}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Node.js / Express) ─────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:   postgresql://${POSTGRES_USER:-typesend}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-typesend}
      JWT_SECRET:     ${JWT_SECRET}
      PORT:           3001
      NODE_ENV:       production
      ADMIN_EMAIL:    ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL:   ${FRONTEND_URL:-https://crm.typesend.com.br}
      META_APP_ID:                ${META_APP_ID}
      META_APP_SECRET:            ${META_APP_SECRET}
      META_GLOBAL_ACCESS_TOKEN:   ${META_GLOBAL_ACCESS_TOKEN}
      META_WEBHOOK_VERIFY_TOKEN:  ${META_WEBHOOK_VERIFY_TOKEN}
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:      ${STRIPE_WEBHOOK_SECRET}
      ANTHROPIC_API_KEY:          ${ANTHROPIC_API_KEY}
    volumes:
      - backend_data:/app/data
    networks:
      - typesend_net
      - redeInterna
    labels:
      - traefik.enable=true
      - traefik.http.routers.typesend-api.rule=Host(`api2.typesend.com.br`)
      - traefik.http.routers.typesend-api.entrypoints=websecure
      - traefik.http.routers.typesend-api.tls.certresolver=letsencryptresolver
      - traefik.http.services.typesend-api.loadbalancer.server.port=3001

volumes:
  postgres_data:
  backend_data:

networks:
  typesend_net:
    driver: bridge
  redeInterna:
    external: true
    name: redeInterna
