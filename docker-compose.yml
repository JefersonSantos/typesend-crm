services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-typesend}
      POSTGRES_USER:     ${POSTGRES_USER:-typesend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - typesend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-typesend} -d ${POSTGRES_DB:-typesend}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: any
        delay: 5s

  # ── Backend (Node.js / Express) ─────────────────────────────────────────────
  backend:
    image: ghcr.io/jefersonsantos/typesend-crm-backend:latest
    depends_on:
      - db
    environment:
      DATABASE_URL:               postgresql://${POSTGRES_USER:-typesend}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-typesend}
      JWT_SECRET:                 ${JWT_SECRET}
      PORT:                       3001
      NODE_ENV:                   production
      ADMIN_EMAIL:                ${ADMIN_EMAIL}
      ADMIN_PASSWORD:             ${ADMIN_PASSWORD}
      FRONTEND_URL:               ${FRONTEND_URL:-https://crm.typesend.com.br}
      META_APP_ID:                ${META_APP_ID}
      META_APP_SECRET:            ${META_APP_SECRET}
      META_GLOBAL_ACCESS_TOKEN:   ${META_GLOBAL_ACCESS_TOKEN}
      META_WEBHOOK_VERIFY_TOKEN:  ${META_WEBHOOK_VERIFY_TOKEN}
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:      ${STRIPE_WEBHOOK_SECRET}
      ANTHROPIC_API_KEY:          ${ANTHROPIC_API_KEY}
    volumes:
      - backend_data:/app/data
    networks:
      - typesend_net
      - redeInterna
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - traefik.enable=true
        - traefik.http.routers.typesend-api2.rule=Host(`api2.typesend.com.br`)
        - traefik.http.routers.typesend-api2.entrypoints=websecure
        - traefik.http.routers.typesend-api2.tls.certresolver=letsencryptresolver
        - traefik.http.services.typesend-api2.loadbalancer.server.port=3001

volumes:
  postgres_data:
  backend_data:

networks:
  typesend_net:
    driver: overlay
  redeInterna:
    external: true
    name: redeInterna
